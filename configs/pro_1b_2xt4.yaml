# Ghassan v1 Pro 1B — 2xT4 DDP pretrain (the missing 1B+2xT4 recipe).
# Same unified 1B architecture as pro_v1.yaml: ~1.04B total / ~612M active.
#   36 layers, 768 hidden, 12 heads, 4 KV heads, 8 experts top-4 + shared.
# DDP contract (data-parallel, NOT sharded): each rank owns a FULL replica and
# must stay <=16GB VRAM on its own T4 (same ~14.4GB envelope as pro_v1 single).
#   global tokens/update = B * T * accum * world = 1*512*64*2 = 65,536
#   (identical to pro_v1 single-T4 1*512*128=65,536, so the optimizer-step
#   schedule and total-tokens budget are preserved; 2 ranks give ~2x tok/s,
#   not 2x batch. LR is NOT scaled with world size.)
# Run: CONFIG_PT=configs/pro_1b_2xt4.yaml CONFIG_SFT=configs/sft_pro_1b_2xt4.yaml \
#      bash kaggle/train_2xt4.sh (verifies NCCL, VRAM, parity, data, quota).
# NOTE: the 1B honest peak (~14.4GB) needs the full-16GB preflight gate
# (--max-vram-mb 16384); the 15GiB gate is for the 480M recipes only.

model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 36
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2240  # dense fallback only (unused when use_moe=true)
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 8
  moe_top_k: 4
  moe_expert_dim: 1280
  moe_shared: true
  moe_aux_scale: 0.01      # classic aux loss (aux-free=false)
  moe_aux_free: false       # Pro: true = no aux grad (requires aux_scale 0.0)
  moe_jitter: 0.01
  z_loss_scale: 0.0001
  use_qk_norm: true
  rope_scale: 1.0
  rope_yarn_mscale: 0.0
  rope_yarn_low: 1.0        # Pro YaRN ramp (default = legacy)
  rope_yarn_high: 32.0
  sliding_window: 0         # Pro SWA: 0=off (full causal)
  rope_type: 0              # Pro: 0=interleaved (current kernels)

tokenizer:
  path: artifacts/tokenizer/english32k.gtok
  vocab_size: 32000

training:
  stage: pretrain
  device: cuda
  precision: fp32
  gemm_fp16: true
  fp16_weight_cache: false
  ce_chunks: 4
  loss_scale_init: 8192      # MEASURED on T4: 16384 overflows on step 0-1 every run (one step wasted); 8192 is the stable level and the scaler still grows to 16384 after 2000 clean steps
  loss_scale_window: 2000
  batch_size: 1
  seq_len: 512
  grad_accum: 64           # 1*512*64*2GPUs = 65,536 global (== pro_v1 single)
  max_steps: 0
  epochs: 2
  learning_rate: 3.0e-4    # Lion effective LR = 0.1x = 3e-5 (sign updates are large)
  min_lr_ratio: 0.1
  warmup_steps: 1500
  optimizer: lion            # MANDATORY on T4 (AdamW OOMs at 1B)
  scheduler: wsd
  sched_decay_frac: 0.2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.99
  eps: 1.0e-8
  grad_clip: 1.0
  ns_steps: 5
  muon_min_ns_dim: 256
  muon_vec_ratio: 0.1
  seed: 42
  log_every: 10
  eval_every: 250
  eval_batches: 20
  save_every: 500
  checkpoint_dir: artifacts/checkpoints/pro_1b_2xt4
  data_dir: artifacts/shards_en
  resume: auto
  activation_checkpointing: false
  ckpt_segments: 1
  pack_sequences: true
  ddp: true
  output_budget_mb: 19456

data:
  train_glob: artifacts/shards_en/train_*.gbin
  val_glob: artifacts/shards_en/val_*.gbin
  mix:
    english_chat: 0.80
    english_instruction: 0.20
