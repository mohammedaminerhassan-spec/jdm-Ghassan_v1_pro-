# Ghassan v1 Pro - SFT (Instruction & Chat Tuning) Recipe
# Stage 2: Fine-tune the pretrained Pro base model on multi-domain Darija instructions.
# Gives the model reasoning, polite Moroccan etiquette, and anti-hallucination discipline.

model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 26
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2240
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 8
  moe_top_k: 2
  moe_expert_dim: 768
  moe_shared: true
  moe_aux_scale: 0.01
  moe_jitter: 0.01         # DeepSeek-V2 router exploration (train-only)

tokenizer:
  path: artifacts/tokenizer/darija32k.gtok
  vocab_size: 32000

training:
  stage: sft
  device: cuda
  precision: fp32
  batch_size: 2
  seq_len: 1024
  grad_accum: 16
  max_steps: 0
  epochs: 4
  # Lion x0.1: 1.5e-4 => effective 1.5e-5 (was 1.5e-6, underfits).
  learning_rate: 1.5e-4
  min_lr_ratio: 0.1
  warmup_steps: 150
  optimizer: lion          # T4 memory-efficient optimizer
  scheduler: wsd
  sched_decay_frac: 0.25
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.99              # lion default
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 100
  eval_batches: 15
  save_every: 500
  data_dir: artifacts/shards_pro_sft
  checkpoint_dir: artifacts/checkpoints/pro_sft
  resume: auto
  pretrained_checkpoint: artifacts/checkpoints/pro/last.ckpt
  allow_no_pretrained: false  # P0 guard: fail loudly without pretrained (was true)
  freeze_embeddings: false
  activation_checkpointing: true
  ckpt_segments: 2

data:
  data_dir: artifacts/shards_pro_sft
  train_prefix: train_
  val_prefix: val_
  mix:
    darija_reasoning: 0.35
    darija_chat: 0.30
    arabizi_chat: 0.20
    culture_administration: 0.15
