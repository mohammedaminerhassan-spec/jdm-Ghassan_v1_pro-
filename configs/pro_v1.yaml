# Ghassan v1 Pro — FLAGSHIP Pro recipe (single-T4, DeepSeek-V3/GLM-4 class).
# مشتق من ultra_1b.yaml (~1.016B total / ~336M active) مع حقول Pro الجديدة.
# كل حقول Pro default OFF في الكود، وهنا مفعلة بحذر بلا كسر التوافق:
#   - moe_aux_free: false (classic aux loss 0.01؛ true يتطلب moe_aux_scale 0 —
#     aux-loss-free الكامل مع EMA bias update مفعّل CPU+CUDA)
#   - rope_yarn_low/high: YaRN ramp الكامل مفعّل (default 1/32 = سلوك legacy نفسه)
#   - sliding_window: 0 (off؛ >0 SWA kernel مفعّل CPU+CUDA)
#   - rope_type: 0 (interleaved default؛ 1=neox kernels مفعّلة CPU+CUDA للـcheckpoints الجديدة)
# T4 fit: نفس ultra (Lion + B=1 + T=512 + grad_accum=128 = 65k tok/step).
# Single-session: استعمل kaggle/train_1b.sh مع CONFIG_PT/CONFIG_SFT override:
#   CONFIG_PT=configs/pro_v1.yaml CONFIG_SFT=configs/sft_pro_v1.yaml \
#   PT_DIR=artifacts/shards_1b SFT_DIR=artifacts/shards_1b_sft \
#   bash kaggle/train_1b.sh --time-budget-min 540

model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 36
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2240  # dense fallback only (unused when use_moe=true)
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 10
  moe_top_k: 2
  moe_expert_dim: 1024
  moe_shared: true
  moe_aux_scale: 0.01      # classic aux loss (aux-free=false)
  moe_aux_free: false       # Pro: true = لا aux grad (يتطلب aux_scale 0.0)
  moe_jitter: 0.01
  z_loss_scale: 0.0001
  use_qk_norm: true
  rope_scale: 1.0
  rope_yarn_mscale: 0.0
  rope_yarn_low: 1.0        # Pro YaRN ramp (default = legacy)
  rope_yarn_high: 32.0
  sliding_window: 0         # Pro SWA: 0=off (full causal)
  rope_type: 0              # Pro: 0=interleaved (kernels الحالية)

tokenizer:
  path: artifacts/tokenizer/darija32k.gtok
  vocab_size: 32000

training:
  stage: pretrain
  device: cuda
  precision: fp32
  gemm_fp16: true
  loss_scale_init: 16384
  loss_scale_window: 2000
  batch_size: 1
  seq_len: 512
  grad_accum: 128
  max_steps: 0
  epochs: 2
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 1500
  optimizer: lion
  scheduler: wsd
  sched_decay_frac: 0.2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.99
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 250
  eval_batches: 20
  save_every: 500
  checkpoint_dir: artifacts/checkpoints/pro_v1
  data_dir: artifacts/shards_1b
  resume: auto
  activation_checkpointing: false
  ckpt_segments: 1

data:
  train_glob: artifacts/shards_1b/train_*.gbin
  val_glob: artifacts/shards_1b/val_*.gbin
  mix:
    darija_conversational: 0.40
    darija_vocab: 0.20
    darija_speak: 0.15
    educational_science: 0.15
    darija_qa: 0.10
