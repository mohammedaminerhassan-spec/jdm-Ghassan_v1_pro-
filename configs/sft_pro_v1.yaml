# Ghassan v1 Pro 1B — English SFT stage (matches pro_v1.yaml architecture exactly).
# Stage 2 after pro_v1 pretrain. Same shards, heavier instruction weight.
# Keep this file's model.* block byte-identical to pro_v1.yaml or resume
# fails the architecture gate. Lion + B=1/T=512 like pretrain (T4 fit).

model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 36
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2240
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 10
  moe_top_k: 2
  moe_expert_dim: 1024
  moe_shared: true
  moe_aux_scale: 0.01
  moe_aux_free: false
  moe_jitter: 0.01
  z_loss_scale: 0.0001
  use_qk_norm: true
  rope_scale: 1.0
  rope_yarn_mscale: 0.0
  rope_yarn_low: 1.0
  rope_yarn_high: 32.0
  sliding_window: 0
  rope_type: 0

tokenizer:
  path: artifacts/tokenizer/english32k.gtok
  vocab_size: 32000

training:
  stage: sft
  device: cuda
  precision: fp32
  gemm_fp16: true
  loss_scale_init: 8192      # MEASURED on T4: 16384 overflows on step 0-1 every run (one step wasted); 8192 is the stable level and the scaler still grows to 16384 after 2000 clean steps
  loss_scale_window: 2000
  batch_size: 1
  seq_len: 512
  grad_accum: 64
  max_steps: 0
  epochs: 3
  learning_rate: 1.2e-4
  min_lr_ratio: 0.1
  warmup_steps: 200
  optimizer: lion
  scheduler: wsd
  sched_decay_frac: 0.25
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.99
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 138
  log_every: 10
  eval_every: 100
  eval_batches: 15
  save_every: 500
  data_dir: artifacts/shards_en
  checkpoint_dir: artifacts/checkpoints/pro_v1_sft
  resume: auto
  pretrained_checkpoint: artifacts/checkpoints/pro_v1/last.ckpt
  allow_no_pretrained: false
  freeze_embeddings: false
  activation_checkpointing: false
  ckpt_segments: 1
  pack_sequences: true

data:
  data_dir: artifacts/shards_en
  train_prefix: train_
  val_prefix: val_
  mix:
    english_chat: 0.65
    english_instruction: 0.35
