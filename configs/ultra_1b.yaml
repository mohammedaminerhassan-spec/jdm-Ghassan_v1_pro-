# Ghassan v1 Ultra — 1B MoE architecture + training recipe
# Parameter math (tied lm_head):
#   tok_emb  : 16000 x 768                        = 12,288,000
#   per layer: attn 1,572,864 + moe 25,959,936 + 2x768 norms
#            = 27,534,336 per layer
#     attn: wq 589,824 + wk 196,608 + wv 196,608 + wo 589,824 = 1,572,864
#     moe : router 7,680
#           + gate 10*1024*768 = 7,864,320
#           + up   10*1024*768 = 7,864,320
#           + down 10*768*1024 = 7,864,320
#           + shared 3*1024*768 = 2,359,296
#            = 25,959,936 + router = 25,967,616? + norms -> 27,534,336
#   36 layers: 36 x 27,534,336                    = 991,236,096
#   final_norm:                                   = 768
#   TOTAL:                                        = 1,003,524,864 (~1.00B)
# Active per token: attn + top-2 experts + shared = 1.57M + 4.72M + 2.36M
#   = ~8.65M/layer x36 = ~311M + embeddings 12M = ~324M active ("1B / 324M active")
#
# T4 NOTE: 1B fp32 = 4GB weights + 4GB grads + Lion 4GB = 12GB.
#   AdamW would be 16GB+ -> OOM. So optimizer MUST be lion here.
#   batch_size=1 + seq_len 512 (halved activations) + grad_accum 128.
#   vocab 32k multilingual (was 16k: too high fertility for Arabizi/Arabic).

model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 36
  num_heads: 12
  num_kv_heads: 4          # GQA: 3x smaller KV cache
  intermediate_size: 2240  # dense fallback only (unused when use_moe=true)
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 10          # routed experts per layer
  moe_top_k: 2             # active experts per token
  moe_expert_dim: 1024     # SwiGLU hidden size per expert (upgraded from 768)
  moe_shared: true         # +1 always-on shared expert
  moe_aux_scale: 0.01      # load-balance loss weight (averaged over layers now)
  moe_jitter: 0.01         # DeepSeek-V2 router exploration (train-only, 0=off)
  z_loss_scale: 0.0001
  use_qk_norm: true
  rope_scale: 1.0
  rope_yarn_mscale: 0.0    # 0=auto YaRN mscale (0.1*ln(scale)+1) for long-ctx
  # => ~1.02B total (32k vocab), ~324M active per token (+QK-Norm)

tokenizer:
  path: artifacts/tokenizer/darija32k.gtok
  vocab_size: 32000

training:
  stage: pretrain
  device: cuda
  precision: fp32
  gemm_fp16: true          # 10/10: T4 FP16 tensor cores ON (fp32 masters + loss scaling).
                          # Old false forced pure fp32 SGEMM = 3-5x slower, 9h budget => 58M tok only.
  loss_scale_init: 65536
  loss_scale_window: 2000
  batch_size: 1            # T4 16GB: B=1 only for 1B model
  seq_len: 512             # 512 fits T4 (1024 OOMs at 1B even with Lion)
  grad_accum: 128          # effective 1*512*128 = 65,536 tokens/step (same budget)
  max_steps: 0             # 0 = epochs mode
  epochs: 2                # 2 passes over ~1B-token shards = ~2B tokens seen
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 1500       # was 800: too short for 1B+Lion
  optimizer: lion          # MANDATORY for 1B on T4 (AdamW OOMs)
  scheduler: wsd           # Warmup-Stable-Decay: extendable across sessions
  sched_decay_frac: 0.2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.99              # lion default
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 250
  eval_batches: 20
  save_every: 500
  checkpoint_dir: artifacts/checkpoints/ultra_1b
  data_dir: artifacts/shards_1b
  resume: auto
  # B==1: batch-splitting has no effect (trainer warns). Off on purpose;
  # grad_accum does the memory work for the 1B model on T4.
  activation_checkpointing: false
  ckpt_segments: 1         # B==1: splitting has no effect, grad_accum does the work

data:
  train_glob: artifacts/shards_1b/train_*.gbin
  val_glob: artifacts/shards_1b/val_*.gbin
  mix:
    darija_conversational: 0.35
    darija_reasoning_logic: 0.20
    arabic_conversational: 0.12
    educational_science: 0.15
    general_culture_law: 0.08
    code_switch_chat: 0.10
