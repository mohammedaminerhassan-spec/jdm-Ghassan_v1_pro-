# Ghassan v1 Ultra — FLAGSHIP single-T4 1B MoE recipe (use this on Kaggle;
# configs/t4_1b.yaml is the separate legacy 4xT4-DDP experiment, not this model).
# Parameter math (tied lm_head, 32k vocab — verified against model/model.cpp):
#   tok_emb  : 32000 x 768                        = 24,576,000
#   per layer: attn 1,572,864 + moe 25,959,936 + 2x768 norms + qknorm 128
#            = 27,534,464 per layer
#     attn: wq 589,824 + wk 196,608 + wv 196,608 + wo 589,824 = 1,572,864
#     moe : router 7,680
#           + gate 10*1024*768 = 7,864,320
#           + up   10*1024*768 = 7,864,320
#           + down 10*768*1024 = 7,864,320
#           + shared 3*1024*768 = 2,359,296
#            = 25,959,936 (router included)
#     norms  : attn_norm 768 + ffn_norm 768 + qk_qnorm 64 + qk_knorm 64 = 1,664
#   36 layers: 36 x 27,534,464                    = 991,240,704
#   final_norm:                                   = 768
#   TOTAL:                                        = 1,015,817,472 (~1.016B)
# Active per token: attn 1.57M + router 0.01M + top-2 routed 4.72M + shared 2.36M
#   = ~8.66M/layer x36 = ~311.8M + embeddings 24.6M = ~336M active ("1B / 336M active")
#
# T4 NOTE: 1B fp32 = 4.06GB weights + 4.06GB grads + Lion 4.06GB = ~12.2GB.
#   AdamW would be 16GB+ -> OOM. So optimizer MUST be lion here.
#   batch_size=1 + seq_len 512 (halved activations) + grad_accum 128.
#   vocab 32k multilingual (was 16k: too high fertility for Arabizi/Arabic).

model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 36
  num_heads: 12
  num_kv_heads: 4          # GQA: 3x smaller KV cache
  intermediate_size: 2240  # dense fallback only (unused when use_moe=true)
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 10          # routed experts per layer
  moe_top_k: 2             # active experts per token
  moe_expert_dim: 1024     # SwiGLU hidden size per expert (upgraded from 768)
  moe_shared: true         # +1 always-on shared expert
  moe_aux_scale: 0.01      # load-balance loss weight (averaged over layers now)
  moe_jitter: 0.01         # DeepSeek-V2 router exploration (train-only, 0=off)
  z_loss_scale: 0.0001
  use_qk_norm: true
  rope_scale: 1.0
  rope_yarn_mscale: 0.0    # 0=auto YaRN mscale (0.1*ln(scale)+1) for long-ctx
  # => ~1.02B total (32k vocab), ~324M active per token (+QK-Norm)

tokenizer:
  path: artifacts/tokenizer/darija32k.gtok
  vocab_size: 32000

training:
  stage: pretrain
  device: cuda
  precision: fp32
  gemm_fp16: true          # 10/10: T4 FP16 tensor cores ON (fp32 masters + loss scaling).
                          # Old false forced pure fp32 SGEMM = 3-5x slower, 9h budget => 58M tok only.
  loss_scale_init: 16384     # fp16-safe max (trainer clamps to this; |dlogits| peaks at scale)
  loss_scale_window: 2000
  batch_size: 1            # T4 16GB: B=1 only for 1B model
  seq_len: 512             # 512 fits T4 (1024 OOMs at 1B even with Lion)
  grad_accum: 128          # effective 1*512*128 = 65,536 tokens/step (same budget)
  max_steps: 0             # 0 = epochs mode
  epochs: 2                # stochastic token budget ~= 2x shard tokens (random-window
                           # sampling with replacement, NOT exact corpus passes; the
                           # trainer logs exact supervised tokens seen)
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 1500       # was 800: too short for 1B+Lion
  optimizer: lion          # MANDATORY for 1B on T4 (AdamW OOMs)
  scheduler: wsd           # Warmup-Stable-Decay: extendable across sessions
  sched_decay_frac: 0.2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.99              # lion default
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 250
  eval_batches: 20
  save_every: 500
  checkpoint_dir: artifacts/checkpoints/ultra_1b
  data_dir: artifacts/shards_1b
  resume: auto
  # B==1: batch-splitting has no effect (trainer warns). Off on purpose;
  # grad_accum does the memory work for the 1B model on T4.
  activation_checkpointing: false
  ckpt_segments: 1         # B==1: splitting has no effect, grad_accum does the work

data:
  train_glob: artifacts/shards_1b/train_*.gbin
  val_glob: artifacts/shards_1b/val_*.gbin
  # ACTIVE MIX (must equal what kaggle/build_billion_data.sh materializes —
  # every domain below is built there, so preflight passes and no weight
  # silently vanishes in renormalization).
  #   darija_conversational: synth fluency (700k convs, governor+reasoning in)
  #   darija_vocab:          YOUR dataset-main/*.csv (words, conjugation, grammar)
  #   darija_speak:          YOUR model_speak/ single-script speaking targets
  #   educational_science:   JSON knowledge corpus
  #   darija_qa:             YOUR dataset/qa_darija/ (275k grounded Q&A over the
  #                            CSV tables: teaches RESPONDING, assistant-only loss)
  # To add a domain: build shards with
  #   data_pipeline ... --domain <name>
  # then append "<name>: <weight>" here (weights renormalize automatically;
  # the trainer startup log prints the effective mix — read it, don't assume).
  mix:
    darija_conversational: 0.40
    darija_vocab: 0.20
    darija_speak: 0.15
    educational_science: 0.15
    darija_qa: 0.10         # grounded Q&A over the CSV tables (response
                            # supervision; built by dataset/build_qa.py,
                            # materialized as train_darija_qa_*.gbin)

# inference sampling (CLI only, not training): --temp 0.7 --top-k 40 --top-p 0.92
# --min-p 0.05 --repeat 1.12 --no-repeat-ngram 3 (Darija anti-loop)
