# Ghassan v1 Pro — Upgraded MoE architecture + training recipe
# Parameter math (tied lm_head):
#   tok_emb  : 16000 × 768                        = 12,288,000
#   per layer: attn 1,572,864 + moe 15,931,392 + 2×768 norms
#            = 17,505,792 per layer
#   26 layers: 26 × 17,505,792                    = 455,150,592
#   final_norm:                                   = 768
#   TOTAL:                                        = 467,439,360  (~467M, <= 500M cap)
# Active per token: attn + top-2 experts + shared ≈ 6.9M/layer
#   => ~179M + embeddings ≈ 191M active ("200M + MoE")
#
# v1 Pro upgrades:
#   - Full WSD (Warmup-Stable-Decay) learning rate schedule for optimal MoE convergence
#   - Extended epoch training (5 passes) over clean, repaired, multi-domain shards
#   - Balanced auxiliary loss to ensure uniform expert utilization across all Darija domains

model:
  vocab_size: 32000        # 32k multilingual (was 16k)
  hidden_size: 768
  num_layers: 26
  num_heads: 12
  num_kv_heads: 4          # GQA: 3x smaller KV cache than MHA
  intermediate_size: 2240  # dense fallback only (unused when use_moe=true)
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 8           # routed experts per layer (DeepSeek-style)
  moe_top_k: 2             # active experts per token
  moe_expert_dim: 768      # SwiGLU hidden size per expert
  moe_shared: true         # +1 always-on shared expert
  moe_aux_scale: 0.01      # load-balance loss weight
  moe_jitter: 0.01         # DeepSeek-V2 router exploration (train-only)
  z_loss_scale: 0.0001
  use_qk_norm: true
  rope_scale: 1.0
  rope_yarn_mscale: 0.0    # 0=auto YaRN mscale

tokenizer:
  path: artifacts/tokenizer/darija32k.gtok
  vocab_size: 32000

training:
  stage: pretrain
  device: cuda             # cuda (Kaggle GPU) | cpu
  precision: fp32          # fp32 master weights (stability); export Q4 GGUF after
  gemm_fp16: true          # CUDA: large GEMMs on FP16 tensor cores
  loss_scale_init: 65536
  loss_scale_window: 2000
  batch_size: 2
  seq_len: 1024
  grad_accum: 32           # effective 2*1024*32 = 65,536 tokens/step
  max_steps: 0             # 0 = epochs mode
  epochs: 5                # 5 full passes over the augmented dataset
  learning_rate: 3.5e-4
  min_lr_ratio: 0.1
  warmup_steps: 600
  optimizer: adamw         # adamw | lion
  scheduler: wsd           # Warmup-Stable-Decay: superior convergence for MoE
  sched_decay_frac: 0.2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 250
  eval_batches: 20
  save_every: 500
  checkpoint_dir: artifacts/checkpoints/pro
  data_dir: artifacts/shards_pro
  resume: auto
  activation_checkpointing: true
  ckpt_segments: 2

data:
  train_glob: artifacts/shards_pro/train_*.gbin
  val_glob: artifacts/shards_pro/val_*.gbin
  mix:
    darija_conversational: 0.40
    darija_reasoning_logic: 0.20
    arabic_conversational: 0.15
    educational_science: 0.15
    general_culture_law: 0.10
