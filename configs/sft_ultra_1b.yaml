# Ghassan v1 Ultra 1B - SFT (Instruction & Chat Tuning) Recipe
# Stage 2: Fine-tune the 1B pretrained base on multi-domain Darija instructions.
# Must match ultra_1b.yaml architecture exactly (36L, 10 experts, E=1024).

model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 36
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2240
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 10
  moe_top_k: 2
  moe_expert_dim: 1024
  moe_shared: true
  moe_aux_scale: 0.01
  moe_jitter: 0.01         # DeepSeek-V2 router exploration (train-only)
  z_loss_scale: 0.0001
  use_qk_norm: true
  rope_scale: 1.0
  rope_yarn_mscale: 0.0    # 0=auto YaRN mscale

tokenizer:
  path: artifacts/tokenizer/darija32k.gtok
  vocab_size: 32000

training:
  stage: sft
  device: cuda
  precision: fp32
  gemm_fp16: true           # 10/10: fp16 ON (was false = 3x slower SFT)
  loss_scale_init: 16384    # == trainer fp16-safe clamp: the value that actually runs
  loss_scale_window: 2000
  batch_size: 1
  seq_len: 512
  grad_accum: 64           # effective 32,768 tokens/step (SFT needs smaller steps)
  max_steps: 0
  epochs: 3
  # Lion auto-scales lr x0.1 internally: config 1.2e-4 => effective 1.2e-5.
  # Old 1.2e-5 gave effective 1.2e-6 (too tiny to learn in a few hundred steps).
  learning_rate: 1.2e-4
  min_lr_ratio: 0.1
  warmup_steps: 200
  optimizer: lion          # T4 saver
  scheduler: wsd
  sched_decay_frac: 0.25
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.99
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 100
  eval_batches: 15
  save_every: 500
  data_dir: artifacts/shards_1b_sft
  checkpoint_dir: artifacts/checkpoints/ultra_1b_sft
  resume: auto
  pretrained_checkpoint: artifacts/checkpoints/ultra_1b/last.ckpt
  allow_no_pretrained: false
  freeze_embeddings: false
  # B==1: batch-splitting has no effect (trainer warns). Off on purpose.
  activation_checkpointing: false
  ckpt_segments: 1

data:
  data_dir: artifacts/shards_1b_sft
  train_prefix: train_
  val_prefix: val_
  # ACTIVE MIX (must equal what kaggle/build_billion_data.sh materializes:
  # SFT synth builds darija_chat AND your model_speak/ builds darija_speak,
  # so the old 100%-chat collapse is fixed).
  #   darija_chat:  synth instruction fluency (governor+reasoning in)
  #   darija_speak: YOUR model_speak/ single-script answers (style contract,
  #                 assistant-only loss — this is what makes speech natural)
  #   darija_qa:    YOUR dataset/qa_darija/ (275k grounded Q&A over the CSV
  #                 tables — this is what makes answers CORRECT, assistant-only
  #                 loss; the highest-signal domain per token in this stage)
  # Append "<name>: <weight>" with matching shards to widen (effective mix is
  # printed at trainer startup — verify, don't assume).
  mix:
    darija_chat: 0.45
    darija_speak: 0.30
    darija_qa: 0.25
