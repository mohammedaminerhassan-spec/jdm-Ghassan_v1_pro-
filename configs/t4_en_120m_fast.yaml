# T4-FAST English 120M dense — optimized for Kaggle T4 16GB, <10h, 1GB parquet.
# Why fast:
#  - DENSE (use_moe:false): MoE gather/scatter kills T4 (small GEMMs, low util).
#    Dense 120M hits ~8-12k tok/s on T4 vs ~1-2k tok/s for 480M-MoE.
#  - seq 1024 (not 2048/4096): attention is O(n^2), 2048 is 4x slower.
#  - Lion optimizer: 1 state (m) vs AdamW 2 states (m+v) -> ~30% less VRAM
#    traffic per step, faster step, same quality for chat.
#  - act-checkpoint OFF + ce_chunks 4: recompute costs ~30% time; 120M fits
#    T4 without it at B=4/T=1024. CE chunking keeps logits peak low.
#  - pack_sequences:true: zero padding waste on chat/instruction data.
#  - eval/save rare: eval_every 1000, save_every 1000 -> no stalls.
# Math: 65k tok/step. 1GB parquet ~ 130-180M tokens. 1 epoch ~ 2500 steps.
# At 8k tok/s -> ~6h. Leaves margin for export + smoke test inside 10h.
model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 12
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2048
  max_seq_len: 1024
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: false
  num_experts: 1
  moe_top_k: 1
  moe_expert_dim: 768
  moe_shared: false
  moe_aux_scale: 0.0
  moe_aux_free: false
  moe_jitter: 0.0
  z_loss_scale: 0.0
  use_qk_norm: false
  rope_scale: 1.0
  rope_yarn_mscale: 0.0
  rope_yarn_low: 1.0
  rope_yarn_high: 32.0
  sliding_window: 0
  rope_type: 0

tokenizer:
  path: artifacts/tokenizer/english32k.gtok
  vocab_size: 32000

training:
  stage: pretrain
  device: cuda
  precision: fp32
  gemm_fp16: true
  fp16_weight_cache: true
  ce_chunks: 4
  loss_scale_init: 1024
  loss_scale_max: 2048
  loss_scale_window: 2000
  batch_size: 4
  seq_len: 1024
  grad_accum: 16
  max_steps: 0
  epochs: 1
  learning_rate: 6.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 200
  optimizer: lion
  scheduler: wsd
  sched_decay_frac: 0.15
  weight_decay: 0.05
  beta1: 0.9
  beta2: 0.99
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 20
  eval_every: 1000
  eval_batches: 10
  save_every: 1000
  checkpoint_dir: artifacts/checkpoints/t4_en_120m_fast
  data_dir: artifacts/shards_en
  resume: auto
  activation_checkpointing: false
  ckpt_segments: 1
  pack_sequences: true
  output_budget_mb: 14000

data:
  train_glob: artifacts/shards_en/train_*.gbin
  val_glob: artifacts/shards_en/val_*.gbin

  mix:
    english_chat: 0.65
    english_instruction: 0.35
