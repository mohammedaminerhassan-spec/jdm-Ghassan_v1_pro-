model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 36
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2240
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 8
  moe_top_k: 4
  moe_expert_dim: 1280
  moe_shared: true
  moe_aux_scale: 0.01
  moe_jitter: 0.01
  z_loss_scale: 0.0001
  use_qk_norm: true
  rope_scale: 1.0
  rope_yarn_mscale: 0.0

tokenizer:
  path: artifacts/tokenizer/english32k.gtok
  vocab_size: 32000

training:
  stage: pretrain
  device: cuda
  precision: fp32
  gemm_fp16: true
  fp16_weight_cache: false
  ce_chunks: 4
  loss_scale_init: 8192
  loss_scale_max: 8192
  loss_scale_window: 2000
  batch_size: 1
  seq_len: 512
  grad_accum: 32
  max_steps: 0
  epochs: 2
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 1500
  optimizer: lion
  scheduler: wsd
  sched_decay_frac: 0.2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.99
  eps: 1.0e-8
  grad_clip: 1.0
  ns_steps: 5
  muon_min_ns_dim: 256
  muon_vec_ratio: 0.1
  seed: 42
  log_every: 10
  eval_every: 250
  eval_batches: 20
  save_every: 500
  checkpoint_dir: artifacts/checkpoints/pro_1b_4xt4_legacy
  data_dir: artifacts/shards_en
  resume: auto
  activation_checkpointing: false
  ckpt_segments: 1
  pack_sequences: true
  output_budget_mb: 18432
  ddp: true

data:
  train_glob: artifacts/shards_en/train_*.gbin
  val_glob: artifacts/shards_en/val_*.gbin
  mix:
    english_chat: 0.80
    english_instruction: 0.20
