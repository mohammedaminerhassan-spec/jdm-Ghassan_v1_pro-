# Ghassan v1 Pro English (Ollama variant) — MoE without shared expert for
# llama.cpp / Ollama / LM Studio.
# Native flagship (en_pro) uses moe_shared=true (full quality in ghassan-ai
# only). This variant sets moe_shared=false so `--compat llama_moe` export
# maps to Mixtral-style tensors (ffn_gate_exps/up_exps/down_exps + gate_inp).
# NOTE: moe_shared=false changes the architecture, so this recipe can NOT
# resume en_pro checkpoints — train it as its own base, then export.
# Export: gai_train --config configs/en_ollama.yaml --export model-ollama.gguf
#         --export-profile q4_0 --compat llama_moe --tokenizer artifacts/tokenizer/english32k.gtok
# Verify: ghassan-ai logits --model model-ollama.gguf --prompt "Hello" vs llama.cpp
# GGUF-only: no .gai files anywhere.
# DATA: shared English lake shards (artifacts/shards_en, english32k keep-case).

model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 26
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2240
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 8
  moe_top_k: 2
  moe_expert_dim: 768
  moe_shared: false         # REQUIRED for llama_moe (no shared equivalent in llama.cpp)
  moe_aux_scale: 0.01
  moe_aux_free: false
  moe_jitter: 0.01
  z_loss_scale: 0.0001
  use_qk_norm: false        # REQUIRED false for Ollama (no llama mapping)
  rope_scale: 1.0           # REQUIRED 1.0 for Ollama
  rope_yarn_mscale: 0.0
  rope_yarn_low: 1.0
  rope_yarn_high: 32.0
  sliding_window: 0         # REQUIRED 0 for Ollama
  rope_type: 0              # REQUIRED 0 for Ollama

tokenizer:
  path: artifacts/tokenizer/english32k.gtok
  vocab_size: 32000

training:
  stage: pretrain
  device: cuda
  precision: fp32
  gemm_fp16: true
  loss_scale_init: 16384
  loss_scale_window: 2000
  batch_size: 2
  seq_len: 1024
  grad_accum: 32
  max_steps: 0
  epochs: 2
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 800
  optimizer: lion
  scheduler: wsd
  sched_decay_frac: 0.2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.99
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 250
  eval_batches: 20
  save_every: 500
  checkpoint_dir: artifacts/checkpoints/en_ollama
  data_dir: artifacts/shards_en
  resume: auto
  activation_checkpointing: false
  ckpt_segments: 1
  pack_sequences: true

# inference sampling (CLI only): --temp 0.7 --top-k 40 --top-p 0.92 --min-p 0.05
# --repeat 1.12 --no-repeat-ngram 0 (English: keep connectors/steps repeatable)

data:
  train_glob: artifacts/shards_en/train_*.gbin
  val_glob: artifacts/shards_en/val_*.gbin
  mix:
    english_chat: 0.80
    english_instruction: 0.20
