# Ghassan Darija 1B — SFT (speaking) recipe. Stage 2 of the <=8h run.
# Architecture MUST match configs/darija_1b.yaml exactly (36L, 10 experts).
# Speaking quality comes from `darija_speak` (model_speak/: 6072 SINGLE-SCRIPT
# docs — never train the bilingual "arabizi / arabic" glued answers, they teach
# the model to speak like no human does). Upweighted to 0.45 with
# assistant-only loss; `darija_chat` (synth) keeps fluency and variety.
# Retrieval index over the same model_speak/ dir grounds answers at inference.
#
# Build SFT shards on Kaggle FIRST:
#   data_pipeline synth --out artifacts/synth/darija_sft.jsonl --n 150000 \
#       --seed 9999 --max-template-uses 300
#   data_pipeline build --tokenizer artifacts/tokenizer/darija32k.gtok \
#       --expect-vocab 32000 --out artifacts/shards_darija1b_sft \
#       --chat artifacts/synth/darija_sft.jsonl --domain darija_chat \
#       --shard-tokens 50000000 --seq-len 512
#   data_pipeline json --dir <path-to>/model_speak \
#       --tokenizer artifacts/tokenizer/darija32k.gtok --expect-vocab 32000 \
#       --out artifacts/shards_darija1b_sft --domain darija_speak --seq-len 512

model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 36
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2240
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 10
  moe_top_k: 2
  moe_expert_dim: 1024
  moe_shared: true
  moe_aux_scale: 0.01
  moe_jitter: 0.01
  z_loss_scale: 0.0001
  use_qk_norm: true
  rope_scale: 1.0
  rope_yarn_mscale: 0.0

tokenizer:
  path: artifacts/tokenizer/darija32k.gtok
  vocab_size: 32000

training:
  stage: sft
  device: cuda
  precision: fp32
  gemm_fp16: true
  loss_scale_init: 16384
  loss_scale_window: 2000
  batch_size: 1
  seq_len: 512
  grad_accum: 64            # effective 32,768 tokens/step (SFT needs smaller steps)
  max_steps: 0
  epochs: 3
  # Lion auto-scales lr x0.1 internally: config 1.2e-4 => effective 1.2e-5.
  learning_rate: 1.2e-4
  min_lr_ratio: 0.1
  warmup_steps: 200
  optimizer: lion
  scheduler: wsd
  sched_decay_frac: 0.25
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.99
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 100
  eval_batches: 15
  save_every: 500
  data_dir: artifacts/shards_darija1b_sft
  checkpoint_dir: artifacts/checkpoints/darija_1b_sft
  resume: auto
  pretrained_checkpoint: artifacts/checkpoints/darija_1b/last.ckpt
  allow_no_pretrained: false
  freeze_embeddings: false
  activation_checkpointing: false
  ckpt_segments: 1

data:
  data_dir: artifacts/shards_darija1b_sft
  train_prefix: train_
  val_prefix: val_
  # MUST equal the --domain values materialized above (preflight fails otherwise).
  mix:
    darija_chat: 0.55
    darija_speak: 0.45
