# Ghassan v1 Flash - SFT (instruction tuning) recipe
# Stage 2: Fine-tune the pretrained base model on Darija conversations.
# This turns the base LM into a chat assistant that follows instructions.

model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 26
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2240
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 8
  moe_top_k: 2
  moe_expert_dim: 768
  moe_shared: true
  moe_aux_scale: 0.01
  moe_jitter: 0.01         # DeepSeek-V2 router exploration (train-only)

tokenizer:
  path: artifacts/tokenizer/darija32k.gtok
  vocab_size: 32000

training:
  stage: sft
  device: cuda
  precision: fp32
  batch_size: 2            # B*T capped for T4 16GB (see dry-run)
  seq_len: 1024
  grad_accum: 16
  max_steps: 0             # 0 = epochs mode (exactly one of max_steps/epochs)
  epochs: 3
  # Lion effective lr = config x0.1: 1.0e-4 => 1.0e-5 (was 1.0e-6, underfits SFT).
  learning_rate: 1.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 100
  optimizer: lion           # T4 saver for SFT: single momentum state
  scheduler: wsd            # stable phase + 20% decay suits short SFT runs
  sched_decay_frac: 0.2
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.99               # lion default (0.95 is AdamW; lion paper uses 0.99)
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 100
  eval_batches: 10
  save_every: 500
  data_dir: artifacts/shards_sft
  checkpoint_dir: artifacts/checkpoints/flash_sft
  resume: auto
  pretrained_checkpoint: artifacts/checkpoints/flash/last.ckpt
  allow_no_pretrained: false  # P0 guard: fail loudly without pretrained (was true)   # fallback if running SFT directly
  freeze_embeddings: false
  activation_checkpointing: true
  ckpt_segments: 2

data:
  data_dir: artifacts/shards_sft
  train_prefix: train_
  val_prefix: val_
  mix:
    darija_instructions: 0.45
    darija_chat: 0.30
    arabizi_chat: 0.15
    code_switch_chat: 0.10
