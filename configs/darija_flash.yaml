# Ghassan Darija Flash 480M — PRETRAIN recipe for the <=8h Kaggle T4 run.
# Same architecture as configs/flash_moe.yaml (math verified there):
#   ~480M total (32k vocab, tied embeddings) / ~204M active per token
#   26 layers, 12 heads, 4 KV heads (GQA), 8 experts top-2 + shared, QK-Norm.
# Why Flash 480M and not Ultra 1B for this run:
#   - Real Darija data is ~150k tokens (model_ready) + ~2M (CSV corpus);
#     bulk comes from synth (~300M). ~300M tokens cannot train 1B params
#     meaningfully in 8h; 480M is the Chinchilla-sane choice and the audit's
#     recommended fast-iteration candidate.
#   - B=2/T=1024/AdamW fits T4 16GB (~11.8GB per flash_moe.yaml estimate).
#   - Q4 GGUF ~= 280MB: runs on any PC (like the current local flash model).
#
# Build the shards on Kaggle FIRST (run from repo root):
#   data_pipeline synth --out artifacts/synth/darija_pt.jsonl --n 700000 \
#       --seed 1234 --max-template-uses 500
#   data_pipeline build --tokenizer artifacts/tokenizer/darija32k.gtok \
#       --expect-vocab 32000 --out artifacts/shards_darija \
#       --chat artifacts/synth/darija_pt.jsonl --domain darija_conversational \
#       --shard-tokens 50000000 --seq-len 1024
#   data_pipeline csvs --dir dataset/dataset-main --out artifacts/corpus_darija.txt
#   data_pipeline build --tokenizer artifacts/tokenizer/darija32k.gtok \
#       --expect-vocab 32000 --out artifacts/shards_darija \
#       --text artifacts/corpus_darija.txt --domain darija_vocab \
#       --shard-tokens 50000000 --seq-len 1024
#   data_pipeline json --dir <path-to>/model_ready \
#       --tokenizer artifacts/tokenizer/darija32k.gtok --expect-vocab 32000 \
#       --out artifacts/shards_darija --domain darija_real --seq-len 1024
# Then: train_darija_8h.sh --preflight (mix table must show all 3 domains).
# Timeboxing is done by the runner (pilot-measured tok/s, NOT by epochs):
#   --max-steps overrides `epochs` below.

model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 26
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2240
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 8
  moe_top_k: 2
  moe_expert_dim: 768
  moe_shared: true
  moe_aux_scale: 0.01
  moe_jitter: 0.01
  z_loss_scale: 0.0001
  use_qk_norm: true
  rope_scale: 1.0
  rope_yarn_mscale: 0.0

tokenizer:
  path: artifacts/tokenizer/darija32k.gtok
  vocab_size: 32000

training:
  stage: pretrain
  device: cuda
  precision: fp32
  gemm_fp16: true
  loss_scale_init: 16384
  loss_scale_window: 2000
  batch_size: 2
  seq_len: 1024
  grad_accum: 32            # effective 2*1024*32 = 65,536 tokens/step
  max_steps: 0              # 0 = epochs mode; runner passes --max-steps (timeboxed)
  epochs: 3
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 500
  optimizer: adamw
  scheduler: cosine
  sched_decay_frac: 0.2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 500
  eval_batches: 20
  save_every: 500
  checkpoint_dir: artifacts/checkpoints/darija_flash
  data_dir: artifacts/shards_darija
  resume: auto
  activation_checkpointing: true
  ckpt_segments: 2

data:
  train_glob: artifacts/shards_darija/train_*.gbin
  val_glob: artifacts/shards_darija/val_*.gbin
  # MUST equal the --domain values materialized above (preflight fails otherwise).
  mix:
    darija_conversational: 0.55
    darija_vocab: 0.30
    darija_real: 0.15
