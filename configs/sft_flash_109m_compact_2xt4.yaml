# Ghassan v1 Compact — English SFT for Kaggle 2xT4 DDP.
# Stage 2 after en_compact_2xt4 pretrain. Keep this file's model.* block
# byte-identical to flash_109m_compact_2xt4.yaml or resume fails the architecture gate.
#
# DDP contract: per-GPU B=1 T=2048, accum=8 => global 1*2048*8*2 = 32,768
# (half the stage-1 batch of 65,536; LR NOT scaled with world size).
# Mix includes english_behavior (persona/discipline seasoning from
# build_english_data.sh [3/3]); preflight fails if its shards are missing.
# Stage-2 mix is the deliberate inverse of stage 1: stage 1 learns to hold a
# conversation over the whole lake (behavior weight 0), stage 2 concentrates on
# instruction-following + the authored persona ("Ghassan") contract.
model:
  vocab_size: 32000
  hidden_size: 512
  num_layers: 12
  num_heads: 8
  num_kv_heads: 2
  intermediate_size: 1408
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 8
  moe_top_k: 2
  moe_expert_dim: 512
  moe_shared: true
  moe_aux_scale: 0.01
  moe_aux_free: false
  moe_jitter: 0.01
  z_loss_scale: 0.0001
  use_qk_norm: true
  rope_scale: 1.0
  rope_yarn_mscale: 0.0
  rope_yarn_low: 1.0
  rope_yarn_high: 32.0
  sliding_window: 0
  rope_type: 0

tokenizer:
  path: artifacts/tokenizer/english32k.gtok
  vocab_size: 32000

training:
  stage: sft
  device: cuda
  precision: fp32
  gemm_fp16: true
  fp16_weight_cache: true
  ce_chunks: 4
  loss_scale_init: 1024     # MEASURED on T4 (this model): 8192 overflows on every step
  loss_scale_max: 2048      # the window is 2000 clean steps and this stage runs fewer
  loss_scale_window: 2000
  batch_size: 1
  seq_len: 2048
  grad_accum: 8             # 1*2048*8*2GPUs = 32,768 global (== sft_flash_480m_2xt4)
  max_steps: 0
  epochs: 3
  learning_rate: 2.4e-4
  min_lr_ratio: 0.1
  warmup_steps: 150
  optimizer: adamw
  scheduler: wsd
  sched_decay_frac: 0.25
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0
  ns_steps: 5
  muon_min_ns_dim: 256
  muon_vec_ratio: 0.1
  seed: 2718
  log_every: 20
  eval_every: 250
  eval_batches: 15
  save_every: 1000
  data_dir: artifacts/shards_en
  checkpoint_dir: artifacts/checkpoints/flash_109m_compact_2xt4_sft
  resume: auto
  pretrained_checkpoint: artifacts/checkpoints/flash_109m_compact_2xt4/last.ckpt
  allow_no_pretrained: false
  freeze_embeddings: false
  activation_checkpointing: false
  ckpt_segments: 1
  pack_sequences: true
  ddp: true
  output_budget_mb: 17408

data:
  train_prefix: train_
  val_prefix: val_
  mix:
    english_chat: 0.50
    english_instruction: 0.35
    english_behavior: 0.15    # persona ("Ghassan") seasoning — stage 2 only
