model:
  vocab_size: 32000
  hidden_size: 768
  num_layers: 26
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2240
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 8
  moe_top_k: 2
  moe_expert_dim: 768
  moe_shared: true
  moe_aux_scale: 0.01

tokenizer:
  path: artifacts/tokenizer/english32k.gtok
  vocab_size: 32000

training:
  stage: pretrain
  device: cuda
  precision: fp32
  gemm_fp16: true
  loss_scale_init: 8192
  loss_scale_max: 8192
  loss_scale_window: 2000
  batch_size: 1
  seq_len: 256
  grad_accum: 2
  max_steps: 200
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 20
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 100
  eval_batches: 5
  save_every: 200
  checkpoint_dir: artifacts/checkpoints/pilot
  data_dir: artifacts/shards_en
  resume: auto

data:
  train_glob: artifacts/shards_en/train_*.gbin
  val_glob: artifacts/shards_en/val_*.gbin
