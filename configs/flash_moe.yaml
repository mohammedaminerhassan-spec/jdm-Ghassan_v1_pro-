# Ghassan v1 Flash — MoE architecture + training recipe
# Parameter math (tied lm_head, 32k multilingual vocab):
#   tok_emb  : 32000 × 768                        = 24,576,000
#   per layer: attn 1,572,864 + moe 15,931,392 + 2×768 norms
#            = 17,505,792 per layer
#   26 layers: 26 × 17,505,792                    = 455,150,592
#   final_norm:                                   = 768
#   TOTAL:                                        = 479,727,360  (~480M)
# Active per token: attn + top-2 experts + shared ≈ 6.9M/layer
#   => ~179M + embeddings ≈ 204M active
#
# Training: 5 epochs over the shards (epochs>0 switches the trainer to the
# epoch loop automatically). Token budget scales with the data pipeline output;
# measure step time with the pilot config first, then launch this.

model:
  vocab_size: 32000        # 32k multilingual: Latin + Arabic + Arabizi + math (was 16k, high fertility)
  hidden_size: 768
  num_layers: 26
  num_heads: 12
  num_kv_heads: 4          # GQA: 3x smaller KV cache than MHA
  intermediate_size: 2240  # dense fallback only (unused when use_moe=true)
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 8           # routed experts per layer (DeepSeek-style)
  moe_top_k: 2             # active experts per token
  moe_expert_dim: 768      # SwiGLU hidden size per expert
  moe_shared: true         # +1 always-on shared expert
  moe_aux_scale: 0.01      # load-balance loss weight (0 disables)
  moe_jitter: 0.01         # DeepSeek-V2 router exploration (train-only)
  z_loss_scale: 0.0001     # logit stabilizer (new; 0 = off)
  use_qk_norm: true        # per-head QK RMSNorm (new; MoE stability)
  rope_scale: 1.0          # 1.0 off; 2.0 = 8k ctx via NTK (new)
  rope_yarn_mscale: 0.0    # 0=auto YaRN mscale
  # => ~480M total, ~204M active per token (+3k QK-Norm params)

tokenizer:
  path: artifacts/tokenizer/darija32k.gtok
  vocab_size: 32000

training:
  stage: pretrain
  device: cuda             # cuda (Kaggle GPU) | cpu
  precision: fp32          # fp32 master weights (stability); export Q8/Q4 GGUF after
  gemm_fp16: true          # CUDA: large GEMMs on FP16 tensor cores (T4 fast path)
  loss_scale_init: 16384     # fp16-safe max (trainer clamps to this; |dlogits| peaks at scale)
  loss_scale_window: 2000 # clean steps before doubling the scale
  batch_size: 2            # micro-batch (activations are fp32 tensors:
                           # B*T over ~2048 blows past T4 16GB — see dry-run)
  seq_len: 1024
  grad_accum: 32           # effective 2*1024*32 = 65,536 tokens/step (~11.8GB)
  max_steps: 0             # 0 = epochs mode (exactly one of max_steps/epochs)
  epochs: 3                # stochastic budget ~= 3x shard tokens (random-window
                             # sampling with replacement, NOT exact corpus passes)
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 500
  optimizer: adamw          # adamw (proven) | lion (T4 saver: -1.9GB opt memory, lr auto 0.1x)
  scheduler: cosine         # cosine | wsd (wsd: extend training without retuning)
  sched_decay_frac: 0.2
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 500
  eval_batches: 20
  save_every: 500
  checkpoint_dir: artifacts/checkpoints/flash
  data_dir: artifacts/shards
  resume: auto             # auto | none | <path>
  activation_checkpointing: true   # T4: split B=2 into 2x[B=1] -> ~50% act memory, same math
  ckpt_segments: 2                 # 1..8 (only splits batch dim; B==1 has no effect)

data:
  # Shards are produced by running:
  #   data_pipeline json --dir "Ai dariga datasets/" \
  #                         --tokenizer artifacts/tokenizer/darija.gtok \
  #                         --out artifacts/shards
  train_glob: artifacts/shards/train_*.gbin
  val_glob: artifacts/shards/val_*.gbin
  mix:
    darija_conversational: 0.55
    arabic_conversational: 0.22
    educational: 0.15
    general: 0.08
