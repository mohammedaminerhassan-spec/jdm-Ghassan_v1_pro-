# Ghassan v1 Flash - Pilot MoE Config (Kaggle smoke test)
# Same architecture as configs/flash_moe.yaml, tiny schedule.
# STOP after 200 steps. Measure tok/s here, then extrapolate the full run.
# Do NOT run full training from this file.

model:
  vocab_size: 16000
  hidden_size: 768
  num_layers: 26
  num_heads: 12
  num_kv_heads: 4
  intermediate_size: 2240
  max_seq_len: 4096
  rope_theta: 10000.0
  rms_eps: 1.0e-5
  tie_embeddings: true
  init_std: 0.02
  use_moe: true
  num_experts: 8
  moe_top_k: 2
  moe_expert_dim: 768
  moe_shared: true
  moe_aux_scale: 0.01
  # => 467,439,360 parameters

tokenizer:
  path: artifacts/tokenizer/darija.gtok
  vocab_size: 16000

training:
  stage: pretrain
  device: cuda
  precision: fp32
  gemm_fp16: true          # also validates the FP16 path in the pilot
  loss_scale_init: 65536
  loss_scale_window: 2000
  batch_size: 1            # CONSERVATIVE: start at 1, increase if VRAM allows
  seq_len: 256             # CONSERVATIVE: short context for the pilot
  grad_accum: 2            # effective 512 tokens/step for pilot
  max_steps: 200           # STOP after 200 steps (pilot only)
  learning_rate: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 20
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  grad_clip: 1.0
  seed: 42
  log_every: 10
  eval_every: 100
  eval_batches: 5
  save_every: 200
  checkpoint_dir: artifacts/checkpoints/pilot
  data_dir: artifacts/shards
  resume: auto

data:
  train_glob: artifacts/shards/train_*.gbin
  val_glob: artifacts/shards/val_*.gbin
